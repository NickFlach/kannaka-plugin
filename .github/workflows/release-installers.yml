name: release-installers
# Builds native installers on each release tag (v*) and attaches them as assets.
# Each wraps the shared install engine (install/install.{sh,ps1}); the engine
# does the per-user work (binary + Claude Code plugin + statusline + swarm MCP).
# NOTE: assets are UNSIGNED until signing certs are wired (Authenticode for .msi,
# Apple Developer ID for .pkg) — until then OS SmartScreen/Gatekeeper will warn.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      sign_smoke_test:
        description: 'Prove the signing plumbing with a throwaway self-signed cert (never publishes)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # One answer to "what version is this", for all three packagers.
  #
  # Each derived it independently and they disagreed in ways that only showed
  # up one platform at a time: .deb and .pkg took `${GITHUB_REF_NAME#v}` raw
  # while the .msi ignored the ref entirely and used a version hardcoded in its
  # .wxs, so every msi claimed 1.3.0 and — because Windows Installer decides
  # upgrades on ProductVersion — could never upgrade itself.
  #
  # The raw ref was its own bug. On workflow_dispatch there is no tag, so the
  # ref is a BRANCH name: `.deb` builds have always died on
  # `'0.0.0+fix/my-branch': invalid character in version number`, which meant
  # the installers could not be test-built by hand at all — the exact thing
  # needed to check a packaging change before tagging.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          v="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::notice::ref '${GITHUB_REF_NAME}' is not a version tag — building 0.0.0"
            v="0.0.0"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  linux-deb:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build .deb
        run: bash install/linux/build-deb.sh "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with: { name: kannaka-setup-linux-deb, path: kannaka-setup-linux.deb }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with: { files: kannaka-setup-linux.deb }

  macos-pkg:
    needs: version
    runs-on: macos-latest
    # HAS_SIGN flips to 'true' automatically once MACOS_CERT_P12_BASE64 is set
    # in repo secrets — then the pkg is signed + notarized. See install/SIGNING.md.
    env:
      HAS_SIGN: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build .pkg
        run: bash install/macos/build-pkg.sh "${{ needs.version.outputs.version }}"

      # Answers "do I have the RIGHT certificate" without cutting a release.
      #
      # Apple issues several kinds and only one signs a .pkg. "Developer ID
      # Application" signs .app bundles and is the one people usually have to
      # hand; productsign needs "Developer ID Installer". They look
      # interchangeable in the developer portal and are not, so this names what
      # the keychain actually contains rather than letting a release discover it.
      #
      # Deliberately stops before notarisation: that needs three more secrets
      # and a round trip to Apple, and the mistake being hunted here happens
      # earlier than that.
      - name: Check the signing certificate (smoke test only)
        if: github.event_name == 'workflow_dispatch' && inputs.sign_smoke_test && env.HAS_SIGN == 'true'
        env:
          CERT_B64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.MACOS_CERT_PASSWORD }}
          SIGN_ID: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          trap 'rm -f cert.p12' EXIT
          echo "$CERT_B64" | base64 -d > cert.p12 2>/dev/null || true

          # `security import` reports a corrupt FILE and a wrong PASSWORD with
          # the same message — "MAC verification failed ... (wrong password?)" —
          # and they have completely different fixes. So the file is inspected
          # first, and the operator is told which of the two they are actually
          # looking at.
          SZ=$(wc -c < cert.p12 | tr -d ' ')
          echo "decoded .p12 is ${SZ} bytes"
          if [ "$SZ" -lt 500 ]; then
            echo "::error::the decoded .p12 is only ${SZ} bytes — the secret did not survive the trip."
            echo "::error::Re-encode with:  base64 -i yourcert.p12 | tr -d '\\n' | pbcopy"
            echo "::error::and paste it whole. A wrapped or truncated blob decodes to garbage."
            exit 1
          fi
          # A PKCS#12 is DER: a SEQUENCE, so the first byte is 0x30.
          HDR=$(od -An -tx1 -N2 cert.p12 | tr -d ' \n')
          if [ "${HDR#30}" = "$HDR" ]; then
            echo "::error::decoded bytes do not start with a DER SEQUENCE (got 0x${HDR}) — this is not a .p12."
            echo "::error::The base64 was mangled in transit, or the wrong file was encoded."
            exit 1
          fi
          echo "header looks like DER PKCS#12 (0x${HDR})"

          # ADVISORY ONLY — deliberately not a gate.
          #
          # Keychain Access exports PKCS#12 with legacy algorithms (RC2-40, a
          # SHA-1 MAC). OpenSSL 3 refuses those unless the legacy provider is
          # loaded, and this runner's `openssl` is Homebrew's 3.x. So openssl
          # failing here says nothing about the password — it is a WEAKER reader
          # than the one that matters. Gating on it blamed the operator for a
          # limitation of the checking tool, and cost a round trip doing so.
          echo "openssl: $(command -v openssl) — $(openssl version 2>/dev/null)"
          if openssl pkcs12 -in cert.p12 -passin pass:"$CERT_PW" -noout -legacy 2>/dev/null \
             || openssl pkcs12 -in cert.p12 -passin pass:"$CERT_PW" -noout 2>/dev/null; then
            echo "openssl opened the .p12 with this password"
          else
            echo "openssl could not open it — INCONCLUSIVE here (legacy PKCS#12 vs OpenSSL 3); security import decides"
          fi

          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain

          # THE authority. macOS's own importer reads legacy PKCS#12 natively,
          # so a MAC failure here — with the file already proven to be valid DER
          # of a sane size — really is the password.
          if ! security import cert.p12 -k build.keychain -P "$CERT_PW" -T /usr/bin/productsign 2>import.err; then
            cat import.err
            if grep -qi "MAC verification failed\|wrong password" import.err; then
              echo "::error::MACOS_CERT_PASSWORD does not open this .p12 (the file itself is fine: ${SZ} bytes, valid DER)."
              echo "::error::It is the password from Keychain Access's 'protect the exported items' dialog, typed twice —"
              echo "::error::not your Mac login password and not your Apple ID."
              echo "::error::Verify locally first:  openssl pkcs12 -legacy -in yourcert.p12 -noout -passin pass:'THEPASSWORD'"
            else
              echo "::error::security import failed for a reason other than the password — see above."
            fi
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain

          echo "::group::identities in the keychain"
          security find-identity -v build.keychain || true
          echo "::endgroup::"

          # `-v -p basic` lists identities usable for signing. The Installer
          # identity is the one productsign will accept.
          if security find-identity -v build.keychain | grep -q "Developer ID Installer:"; then
            echo "::notice::found a 'Developer ID Installer' identity — this is the right kind for a .pkg"
          else
            echo "::error::no 'Developer ID Installer' identity in this .p12."
            echo "::error::A 'Developer ID Application' certificate signs .app bundles and CANNOT sign a .pkg."
            echo "::error::Create a Developer ID Installer certificate at developer.apple.com and export THAT as .p12."
            exit 1
          fi

          # The identity is READ FROM THE KEYCHAIN, not transcribed.
          #
          # This used to demand that MACOS_SIGN_IDENTITY match a 52-character
          # string character for character, and failed when it did not. That is
          # a failure mode invented for no reason: the certificate already
          # carries its own name, there is one Installer identity in the .p12,
          # and `security` will say what it is. Asking an operator to retype it —
          # with the brackets, without the quotes find-identity prints around
          # it, without a trailing newline a web form will never show them —
          # buys nothing and cost two rounds.
          #
          # MACOS_SIGN_IDENTITY survives as an OVERRIDE for a keychain holding
          # several Installer identities, trimmed before use because invisible
          # whitespace is exactly what goes wrong.
          DERIVED=$(security find-identity -v build.keychain | sed -n 's/.*"\(Developer ID Installer:[^"]*\)".*/\1/p' | head -1)
          TRIMMED=$(printf '%s' "$SIGN_ID" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//; s/^"//; s/"$//')
          if [ -n "$TRIMMED" ] && security find-identity -v build.keychain | grep -qF "$TRIMMED"; then
            ID="$TRIMMED"
            echo "::notice::using MACOS_SIGN_IDENTITY (it matches the keychain)"
          elif [ -n "$TRIMMED" ]; then
            # Lengths compare without printing either value: GitHub masks the
            # secret, and a masked string tells nobody anything.
            echo "::warning::MACOS_SIGN_IDENTITY does not match the keychain (set: ${#TRIMMED} chars, keychain: ${#DERIVED} chars) — using the keychain's own value"
            echo "::warning::that secret can simply be DELETED; it is only needed when a keychain holds several Installer identities"
            ID="$DERIVED"
          else
            ID="$DERIVED"
            echo "::notice::MACOS_SIGN_IDENTITY unset — using the identity found in the .p12"
          fi
          [ -n "$ID" ] || { echo "::error::no Developer ID Installer identity to sign with"; exit 1; }
          productsign --sign "$ID" kannaka-setup-macos.pkg smoke.pkg

          pkgutil --check-signature smoke.pkg
          echo "::notice::smoke test: the .pkg was signed. Notarisation is NOT covered here."
          rm -f smoke.pkg

      - name: Sign + notarize .pkg (only when cert secret is present)
        if: env.HAS_SIGN == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.sign_smoke_test)
        env:
          CERT_B64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.MACOS_CERT_PASSWORD }}
          SIGN_ID: ${{ secrets.MACOS_SIGN_IDENTITY }}
          AC_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          AC_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          AC_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          # The p12 is removed on EVERY exit, not only a successful one — a
          # failed notarisation must not leave a decrypted certificate in the
          # workspace beside the artifact.
          trap 'rm -f cert.p12' EXIT

          # `base64 -d` rather than BSD's `-D`: macOS has accepted the GNU
          # spelling for years and it is the one SIGNING.md tells people to use
          # when they encode.
          echo "$CERT_B64" | base64 -d > cert.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PW" -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain

          # Read from the keychain, exactly as the smoke test does — a RELEASE
          # must not be able to fail on a transcription error in a string the
          # certificate already carries. MACOS_SIGN_IDENTITY is an override for
          # a keychain holding several Installer identities, trimmed before use.
          DERIVED=$(security find-identity -v build.keychain | sed -n 's/.*"\(Developer ID Installer:[^"]*\)".*/\1/p' | head -1)
          TRIMMED=$(printf '%s' "$SIGN_ID" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//; s/^"//; s/"$//')
          if [ -n "$TRIMMED" ] && security find-identity -v build.keychain | grep -qF "$TRIMMED"; then
            ID="$TRIMMED"
          else
            [ -n "$TRIMMED" ] && echo "::warning::MACOS_SIGN_IDENTITY does not match the keychain — using the identity from the .p12"
            ID="$DERIVED"
          fi
          if [ -z "$ID" ]; then
            echo "::error::no 'Developer ID Installer' identity in this .p12 — a 'Developer ID Application' certificate cannot sign a .pkg"
            exit 1
          fi
          echo "signing as: $ID"
          productsign --sign "$ID" kannaka-setup-macos.pkg signed.pkg
          mv signed.pkg kannaka-setup-macos.pkg

          # Preflight the three notarisation credentials BEFORE uploading a
          # package. `notarytool history` is a cheap read-only call that fails
          # the same way a submission would, so a bad credential costs seconds
          # instead of an upload — and, more to the point, gets diagnosed rather
          # than reported as Apple's "Invalid or inaccessible developer team ID",
          # which names one of three values while blaming a fourth thing.
          #
          # Trimmed first. A secret pasted into a web form carries whatever
          # whitespace came with it, and every credential problem in this
          # workflow so far has been a transcription artefact rather than a
          # wrong value.
          AC_APPLE_ID=$(printf '%s' "$AC_APPLE_ID" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
          AC_TEAM_ID=$(printf '%s' "$AC_TEAM_ID"   | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
          AC_PASSWORD=$(printf '%s' "$AC_PASSWORD" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')

          # Shapes are checkable without revealing anything: GitHub masks the
          # values, so a message quoting one prints *** and helps nobody.
          bad=0
          case "$AC_APPLE_ID" in
            *@*.*) : ;;
            *) echo "::error::MACOS_NOTARY_APPLE_ID does not look like an email address (${#AC_APPLE_ID} chars)"; bad=1 ;;
          esac
          if ! printf '%s' "$AC_TEAM_ID" | grep -Eq '^[A-Z0-9]{10}$'; then
            echo "::error::MACOS_NOTARY_TEAM_ID should be exactly 10 upper-case alphanumerics (got ${#AC_TEAM_ID} chars) — for this certificate it is the code inside the identity name"
            bad=1
          fi
          # App-specific passwords are always xxxx-xxxx-xxxx-xxxx, lower case.
          # This is the single most diagnostic check available: an Apple ID
          # password or a copied cert password cannot match it.
          if ! printf '%s' "$AC_PASSWORD" | grep -Eq '^[a-z]{4}-[a-z]{4}-[a-z]{4}-[a-z]{4}$'; then
            echo "::error::MACOS_NOTARY_PASSWORD is not shaped like an app-specific password (${#AC_PASSWORD} chars; expected 19, as abcd-efgh-ijkl-mnop)"
            echo "::error::Generate one at appleid.apple.com → Sign-In and Security → App-Specific Passwords. It is not your Apple ID password and not the .p12 password."
            bad=1
          fi
          [ "$bad" -eq 0 ] || exit 1

          echo "credential shapes look right; asking Apple whether they work together…"
          if ! xcrun notarytool history --apple-id "$AC_APPLE_ID" --team-id "$AC_TEAM_ID" --password "$AC_PASSWORD" >/dev/null 2>preflight.err; then
            cat preflight.err
            echo "::error::Apple rejected these credentials before any upload was attempted."
            echo "::error::The same three values are what 'xcrun notarytool history' takes locally — if that works on your Mac,"
            echo "::error::then a secret differs from what you typed there (whitespace, or a password generated under a different Apple ID)."
            exit 1
          fi
          echo "::notice::notarisation credentials accepted by Apple"

          # `notarytool submit --wait` returns success for a submission that was
          # ACCEPTED for processing and then REJECTED, in some versions — so the
          # status is read back rather than inferred from the exit code. This is
          # the same class of mistake as trusting a custom action's Return code.
          xcrun notarytool submit kannaka-setup-macos.pkg \
            --apple-id "$AC_APPLE_ID" --team-id "$AC_TEAM_ID" --password "$AC_PASSWORD" \
            --wait --output-format json > notary.json
          cat notary.json
          status=$(python3 -c 'import json,sys;print(json.load(open("notary.json")).get("status",""))')
          if [ "$status" != "Accepted" ]; then
            echo "::error::notarisation status was '$status', not Accepted"
            exit 1
          fi

          xcrun stapler staple kannaka-setup-macos.pkg

      # The half that was missing, matching the Windows verify. An unsigned or
      # unstapled .pkg published under a release that claims to be signed is
      # exactly the silent success this repo keeps producing.
      - name: Verify the .pkg is signed and stapled
        if: env.HAS_SIGN == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.sign_smoke_test)
        run: |
          pkgutil --check-signature kannaka-setup-macos.pkg
          # `stapler validate` is the one that proves Gatekeeper will pass
          # OFFLINE. Without a stapled ticket a notarised package still prompts
          # on a machine that cannot reach Apple.
          xcrun stapler validate kannaka-setup-macos.pkg
      - uses: actions/upload-artifact@v4
        with: { name: kannaka-setup-macos-pkg, path: kannaka-setup-macos.pkg }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with: { files: kannaka-setup-macos.pkg }

  windows-msi:
    needs: version
    runs-on: windows-latest
    # HAS_SIGN flips to 'true' automatically once WINDOWS_CERT_PFX_BASE64 is set
    # in repo secrets — then the msi is Authenticode-signed. See install/SIGNING.md.
    env:
      HAS_SIGN: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install WiX (pin v5 — pre-OSMF licensing gate)
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build .msi
        shell: pwsh
        # Version passed in, not hardcoded in the .wxs — see the `version` job.
        run: wix build install/windows/kannaka.wxs -d Version="${{ needs.version.outputs.version }}" -o kannaka-setup-windows.msi
      # A self-signed certificate, ONLY for `workflow_dispatch` with
      # sign_smoke_test=true. It proves the plumbing — decode a pfx, find
      # signtool, sign, verify a signature is present — without anyone buying a
      # certificate first. It is worthless as trust and deliberately so: the
      # verify step below separates "is signed" from "chains to a trusted root",
      # and a smoke-test artifact passes the first and fails the second.
      #
      # This exists because every other never-executed path in this repo turned
      # out to be broken the first time it ran. Finding that out on the release
      # that follows a cert purchase is the expensive way.
      - name: Forge a throwaway signing cert (smoke test only)
        if: github.event_name == 'workflow_dispatch' && inputs.sign_smoke_test
        shell: pwsh
        run: |
          $c = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Kannaka Smoke Test" `
                 -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(1)
          $pw = ConvertTo-SecureString -String "smoke" -Force -AsPlainText
          Export-PfxCertificate -Cert $c -FilePath smoke.pfx -Password $pw | Out-Null
          $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes("smoke.pfx"))
          # Through the same env vars the real secrets use, so the signing step
          # below is byte-identical in both modes rather than branching.
          "PFX_B64=$b64"  | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "PFX_PW=smoke"  | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "DO_SIGN=true"  | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "SMOKE=true"    | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Remove-Item smoke.pfx

      - name: Decide whether to sign
        shell: pwsh
        run: |
          if ($env:DO_SIGN -ne 'true' -and $env:HAS_SIGN -eq 'true') {
            "DO_SIGN=true" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          }

      - name: Sign .msi (Authenticode)
        if: env.DO_SIGN == 'true'
        shell: pwsh
        env:
          # Empty in smoke mode; the forge step put the throwaway pair in
          # GITHUB_ENV, and a step's `env:` does not override that.
          REAL_PFX_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          REAL_PFX_PW: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $b64 = if ($env:PFX_B64) { $env:PFX_B64 } else { $env:REAL_PFX_B64 }
          $pw  = if ($env:PFX_B64) { $env:PFX_PW }  else { $env:REAL_PFX_PW }
          [IO.File]::WriteAllBytes("$PWD\cert.pfx", [Convert]::FromBase64String($b64))
          try {
            # Sorted NEWEST first. Unsorted, Get-ChildItem returns SDK versions
            # in directory order, so a runner carrying several Windows Kits
            # could sign with a years-old signtool — which is the kind of thing
            # that works until the day a new digest or timestamp option is
            # required and then fails obscurely.
            $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -like "*\x64\*" } |
                  Sort-Object { try { [version]($_.FullName -replace '.*\\10\\bin\\([0-9.]+)\\.*','$1') } catch { [version]'0.0' } } -Descending |
                  Select-Object -ExpandProperty FullName -First 1
            if (-not $st) { throw "signtool.exe not found under the Windows 10 SDK — cannot sign" }
            Write-Host "signtool: $st"
            & $st sign /fd SHA256 /f cert.pfx /p $pw /tr http://timestamp.digicert.com /td SHA256 kannaka-setup-windows.msi
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed with exit $LASTEXITCODE" }
          } finally {
            # In `finally` so a failed signing does not leave a decrypted
            # certificate sitting in the workspace next to the artifact.
            Remove-Item cert.pfx -Force -ErrorAction SilentlyContinue
          }

      # The half that was missing. Signing that quietly did nothing would have
      # shipped an unsigned installer under a release that claims to be signed —
      # the same silent-success shape as the msi's old Return="ignore".
      - name: Verify the .msi carries a signature
        if: env.DO_SIGN == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sig = Get-AuthenticodeSignature kannaka-setup-windows.msi
          Write-Host "status: $($sig.Status)  signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -eq 'NotSigned' -or -not $sig.SignerCertificate) {
            throw "the .msi is not signed — refusing to publish it as signed"
          }
          if ($env:SMOKE -eq 'true') {
            # A throwaway cert cannot chain to a trusted root, and must not be
            # allowed to look like it did. Asserting the failure is what keeps
            # this test honest about what it proved.
            if ($sig.Status -eq 'Valid') { throw "a self-signed smoke cert reported Valid — the check is not discriminating" }
            Write-Host "::notice::smoke test: the msi was signed and the untrusted chain was correctly rejected ($($sig.Status))"
          } elseif ($sig.Status -ne 'Valid') {
            throw "signature present but not trusted: $($sig.Status) — a real certificate must chain to a trusted root"
          }

      - uses: actions/upload-artifact@v4
        with: { name: kannaka-setup-windows-msi, path: kannaka-setup-windows.msi }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with: { files: kannaka-setup-windows.msi }

  # ───────────────────────────────────────────────────────────────────────────
  # Supply-chain trust for the installer artifacts — NO paid certs required:
  #   • <artifact>.sha256 — per-file checksum sidecar (matches the engine-binary
  #     convention install.sh already verifies against).
  #   • SHA256SUMS.txt     — one manifest covering all three installers.
  #   • cosign keyless     — a Sigstore signature (.sig) + cert (.pem) per artifact
  #     AND for the manifest; identity = THIS workflow via GitHub OIDC, recorded
  #     in the public Rekor transparency log. Verify without a shared key (SIGNING.md).
  # Runs unconditionally and free. Signing is best-effort: a Sigstore/Rekor outage
  # emits a loud warning but NEVER blocks the release (checksums still ship). The
  # Authenticode/Apple notarization above is the separate, cert-gated path that
  # additionally silences OS SmartScreen/Gatekeeper. On a non-tag run
  # (workflow_dispatch) everything is built + signed to exercise the path, but
  # nothing is attached to a release.
  # ───────────────────────────────────────────────────────────────────────────
  trust:
    needs: [linux-deb, macos-pkg, windows-msi]
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach checksums + signatures to the release
      id-token: write # OIDC identity for cosign keyless signing
    steps:
      - name: Gather installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums (per-file .sha256 + SHA256SUMS.txt manifest)
        working-directory: dist
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(kannaka-setup-*.deb kannaka-setup-*.pkg kannaka-setup-*.msi)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no installer artifacts found in dist/" >&2
            exit 1
          fi
          : > SHA256SUMS.txt
          for f in "${files[@]}"; do
            # one line "<hash>  <file>" -> appended to the manifest and its own sidecar
            sha256sum "$f" | tee -a SHA256SUMS.txt > "$f.sha256"
          done
          echo "---- SHA256SUMS.txt ----"
          cat SHA256SUMS.txt
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign artifacts + manifest (keyless / Sigstore)
        id: sign
        continue-on-error: true # a Sigstore outage must never block a release
        working-directory: dist
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in kannaka-setup-*.deb kannaka-setup-*.pkg kannaka-setup-*.msi SHA256SUMS.txt; do
            [ -e "$f" ] || continue
            echo "signing $f"
            cosign sign-blob --yes \
              --output-signature "$f.sig" \
              --output-certificate "$f.pem" \
              "$f"
          done
      - name: Warn loudly if signing did not complete
        if: steps.sign.outcome == 'failure'
        run: |
          echo "::warning title=Sigstore signing failed::cosign sign-blob did not complete — the installers still ship with SHA256 checksums but WITHOUT Sigstore signatures this release. Most likely a Sigstore/Rekor/Fulcio outage; re-run this job once Sigstore is healthy. The release was NOT blocked."
      - name: Attach trust assets to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SHA256SUMS.txt
            dist/*.sha256
            dist/*.sig
            dist/*.pem
